version: "3.8"

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment:
    OLLAMA_URL: http://host.docker.internal:11434
    OLLAMA_MODEL: llama3.1
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    _AIRFLOW_DB_MIGRATE: "true"
    _AIRFLOW_WWW_USER_CREATE: "true"
    _AIRFLOW_WWW_USER_USERNAME: admin
    _AIRFLOW_WWW_USER_PASSWORD: admin
    PYTHONPATH: /opt/airflow
    # Extra Python packages the DAGs need (installed at container startup)
    _PIP_ADDITIONAL_REQUIREMENTS: "boto3==1.34.144 psycopg2-binary==2.9.9"
    # These use Docker network service names, not localhost — the Airflow
    # containers live on the same Docker network as minio/postgres_app,
    # so they reach each other by service name instead of localhost.
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: retailpulse
    MINIO_SECRET_KEY: retailpulse123
    MINIO_BUCKET: retailpulse-lake
    POSTGRES_HOST: postgres_app
    POSTGRES_PORT: "5432"
    POSTGRES_DB: retailpulse
    POSTGRES_USER: retailpulse
    POSTGRES_PASSWORD: retailpulse
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - ./warehouse:/opt/airflow/warehouse
    - ./genai:/opt/airflow/genai
    - ./ingestion:/opt/airflow/ingestion
  depends_on:
    postgres_airflow:
      condition: service_healthy
    postgres_app:
      condition: service_healthy
    minio:
      condition: service_started

services:

  # --- App warehouse (Silver/Gold data lives here, separate from Airflow's own metadata DB) ---
  postgres_app:
    image: postgres:16
    container_name: retailpulse_postgres_app
    restart: unless-stopped
    environment:
      POSTGRES_USER: retailpulse
      POSTGRES_PASSWORD: retailpulse
      POSTGRES_DB: retailpulse
    ports:
      - "5432:5432"
    volumes:
      - pg_app_data:/var/lib/postgresql/data
      - ./warehouse/postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Airflow's own metadata database (kept separate from the app warehouse on purpose) ---
  postgres_airflow:
    image: postgres:16
    container_name: retailpulse_postgres_airflow
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pg_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: retailpulse_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: retailpulse_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: retailpulse_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: retailpulse
      MINIO_ROOT_PASSWORD: retailpulse123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data

  airflow-init:
    <<: *airflow-common
    container_name: retailpulse_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow db migrate && airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com || true"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: retailpulse_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    container_name: retailpulse_airflow_scheduler
    command: scheduler
    depends_on:
      - airflow-init

volumes:
  pg_app_data:
  pg_airflow_data:
  mongo_data:
  minio_data:
  airflow_logs: